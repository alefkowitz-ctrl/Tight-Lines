function ReportMap({rivers, center}){
  const [pins, setPins] = React.useState([]);
  const mapRef = React.useRef(null);

  React.useEffect(()=>{
    if(!rivers||!rivers.length||!center?.label) return;
    // Geocode each river name near the search location
    async function geocodeRivers(){
      const results = [];
      for(const r of rivers){
        try{
          const data = await geocode(`${r.name} near ${center.label}`);
          if(data&&data.length){
            results.push({name:r.name, conditions:r.conditions, lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon)});
          }
        }catch{}
      }
      setPins(results);
    }
    geocodeRivers();
  },[rivers, center]);

  if(!pins.length) return(
    <div style={{marginTop:10,padding:"12px",background:"rgba(0,0,0,0.2)",borderRadius:10,fontSize:12,color:"var(--stone)",fontStyle:"italic",textAlign:"center",animation:"pulse 1.5s infinite"}}>📍 Locating rivers on map…</div>
  );

  // Build OpenStreetMap bbox from pin bounds
  const lats=pins.map(p=>p.lat), lngs=pins.map(p=>p.lng);
  const minLat=Math.min(...lats)-0.15, maxLat=Math.max(...lats)+0.15;
  const minLng=Math.min(...lngs)-0.2, maxLng=Math.max(...lngs)+0.2;
  const bbox=`${minLng},${minLat},${maxLng},${maxLat}`;
  const markers=pins.map(p=>`${p.lat},${p.lng}`).join("|");
  const src=`https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${pins[0].lat}%2C${pins[0].lng}`;

  return(
    <div style={{marginTop:14}}>
      <div style={{fontSize:11,color:"var(--stone)",marginBottom:6,fontStyle:"italic"}}>📍 Rivers in this report</div>
      <div style={{borderRadius:12,overflow:"hidden",border:"1px solid rgba(255,255,255,0.1)"}}>
        <iframe title="Rivers Map" width="100%" height="240" frameBorder="0" style={{display:"block"}} src={src} allowFullScreen/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:8}}>
        {pins.map((p,i)=>(
          <a key={i} href={`https://maps.google.com/?q=${p.lat},${p.lng}`} target="_blank" rel="noreferrer"
            style={{fontSize:11,color:"var(--sky)",background:"rgba(0,0,0,0.3)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"4px 10px",textDecoration:"none",display:"flex",alignItems:"center",gap:4}}>
            📍 {p.name}
          </a>
        ))}
      </div>
    </div>
  );
}

function TripPlanner({defaultLocation}){
  const [loc,setLoc]=useState({label:defaultLocation||"",lat:null,lng:null});
  const [date,setDate]=useState(()=>{const d=new Date();d.setDate(d.getDate()+3);return d.toISOString().split("T")[0];});
  const [steps,setSteps]=useState([]);
  const [busy,setBusy]=useState(false);
  const [error,setError]=useState(null);
  const [wxData,setWxData]=useState(null);
  const [flowPts,setFlowPts]=useState([]);
  const [flowLabel,setFlowLabel]=useState("");
  const [gauges,setGauges]=useState([]);

  const [shops,setShops]=useState([]);
  const [report,setReport]=useState(null);
  const [hasKey,setHasKey]=useState(!!getKey());

  useEffect(()=>{if(defaultLocation)setLoc(l=>({...l,label:defaultLocation}));},[defaultLocation]);

  function addStep(text,state="done"){
    setSteps(prev=>{
      const n=[...prev];
      if(n.length&&n[n.length-1].state==="active")n[n.length-1].state="done";
      n.push({text,state});return n;
    });
  }

  async function generate(){
    if(!loc.label.trim()){setError("Please enter a destination.");return;}
    setBusy(true);setError(null);setSteps([]);
    setWxData(null);setFlowPts([]);setGauges([]);setShops([]);setReport(null);
    try{
      addStep("Finding location…","active");
      let lat=loc.lat,lng=loc.lng;
      if(!lat||!lng){
        const data=await geocode(loc.label);
        if(!data.length)throw new Error("Location not found.");
        lat=parseFloat(data[0].lat);lng=parseFloat(data[0].lon);
        setLoc(l=>({...l,lat,lng}));
      }
      addStep(`📍 ${loc.label}`);

      addStep("Fetching forecast…","active");
      const wx=await fetchWeather(lat,lng);
      setWxData(wx);
      addStep("Forecast loaded ✓");

      addStep("Loading stream data…","active");
      const[liveD,histD]=await Promise.all([fetchUSGSLive(lat,lng),fetchUSGSHistory(lat,lng)]);
      const liveTS=liveD.value?.timeSeries??[];
      const pg=liveTS.map(t=>{
        const raw=t.values?.[0]?.value?.[0]?.value;
        const cfs=raw!=null?parseFloat(raw):null;
        const{label,cls}=cfsLabel(cfs);
        const siteNo=(t.sourceInfo?.siteCode?.[0]?.value)||"";
        const siteLat=parseFloat(t.sourceInfo?.geoLocation?.geogLocation?.latitude||0);
        const siteLng=parseFloat(t.sourceInfo?.geoLocation?.geogLocation?.longitude||0);
        const dist=Math.sqrt(Math.pow(siteLat-lat,2)+Math.pow(siteLng-lng,2));
        return{name:t.sourceInfo?.siteName??"Unknown",cfs,label,cls,siteNo,dist};
      }).filter(s=>s.cfs===null||(s.cfs>=0&&s.cfs<500000))
        .sort((a,b)=>a.dist-b.dist)
        .slice(0,6);
      const maxCFS2=Math.max(...pg.map(g=>g.cfs||0),1);
      const pgScaled=pg.map(g=>({...g,pct:g.cfs?Math.min(Math.round((g.cfs/maxCFS2)*95),100):0}));
      setGauges(pgScaled);
      const histTS=histD.value?.timeSeries??[];
      if(histTS.length){
        const best=histTS.sort((a,b)=>(b.values?.[0]?.value?.length||0)-(a.values?.[0]?.value?.length||0))[0];
        const pts=(best.values?.[0]?.value??[]).map(v=>({t:v.dateTime,v:parseFloat(v.value)})).filter(v=>!isNaN(v.v)&&v.v>=0&&v.v<500000);
        setFlowPts(pts);setFlowLabel(best.sourceInfo?.siteName??"");
      }
      addStep(`${pg.length} stream gauges loaded ✓`);

      if(getKey()){
        addStep("Finding fly shops & fishing report…","active");
        const ds=new Date(date+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
        const mo=new Date(date+"T12:00:00").getMonth();
        const hi=HATCHES[mo].map(h=>`${h.name} (${h.a})`).join(", ");
        const gs=pg.map(g=>`${g.name}: ${g.cfs?.toFixed(0)??"N/A"} CFS (${g.label})`).join("; ")||"No data";
        try{
          // Two separate smaller calls to stay under rate limit
          // Fetch real shops using web search
          try{
            const shopTxt=await askClaude(`Search the web for fly fishing specialty shops near ${loc.label}. Only include dedicated fly fishing retailers or outfitters that sell fly fishing gear, flies, and equipment. Do NOT include hardware stores, sporting goods chains like Bass Pro or Cabelas, or general outdoor stores. Only real shops you can verify exist with working websites. JSON array only, no other text: [{"name":"","rating":0,"reviews":0,"specialty":"","address":"","distanceMiles":0,"website":"https://"}]`,true,500);
            const sd=extractJSON(shopTxt);
            if(Array.isArray(sd)&&sd.length>0) setShops(sd.slice(0,4));
          }catch(e){ console.log("Shop search failed:",e.message); }

          const riverNames=pg.map(g=>g.name).join(", ");
          const reportTxt=await askClaude(`Search web for current fly fishing reports near ${loc.label} on ${ds}. Current USGS stream flows: ${gs}. Active hatches this time of year: ${hi}. Respond with ONLY raw JSON (no markdown, no explanation, start with {): {"overview":"2-3 sentence summary of all waters","recommendation":"best water to fish today and why","rivers":[{"name":"stream name","cfs":"flow","conditions":"fishable? why","techniques":"techniques","flies":["Fly #size","Fly #size","Fly #size"]}],"hatches":"hatching now","bestTimes":"best times of day","tips":"local tip","flyBoxEssentials":["Fly #size","Fly #size","Fly #size","Fly #size"]}`,true,1200);
          let rpt=null;
          // Try direct parse
          try{ rpt=JSON.parse(reportTxt.trim()); }catch{}
          // Try extractJSON helper
          if(!rpt) rpt=extractJSON(reportTxt);
          // Try finding JSON block manually with regex
          if(!rpt){
            try{
              const m=reportTxt.match(/\{[^]*\}/);
              if(m) rpt=JSON.parse(m[0]);
            }catch{}
          }
          if(rpt&&(rpt.overview||rpt.rivers)){
            setReport({
              overview:rpt.overview||"",
              recommendation:rpt.recommendation||"",
              rivers:rpt.rivers||[],
              hatches:rpt.hatches||"",
              bestTimes:rpt.bestTimes||"",
              tips:rpt.tips||"",
              flyBoxEssentials:rpt.flyBoxEssentials||[]
            });
          } else {
            // Show raw text stripped of JSON fences as fallback
            const cleaned=reportTxt.replace(/```json|```/g,"").replace(/^\s*\{[\s\S]*\}\s*$/,"").trim();
            setReport({overview:cleaned||reportTxt,recommendation:"",rivers:[],hatches:"",bestTimes:"",tips:"",flyBoxEssentials:[]});
          }
        }catch(e2){}
        addStep("Report complete ✓");
      }
    }catch(e){
      if(e.message==="NO_KEY"){setError("Add your Anthropic API key above to get AI fishing reports.");}
      else setError(e.message||"Something went wrong.");
    }finally{setBusy(false);}
  }

  const tripDay=new Date(date+"T12:00:00");
  const daysOut=Math.round((tripDay-new Date())/86400000);

  return(
    <div>
      {!hasKey&&<ApiKeySetup onSave={()=>setHasKey(true)}/>}
      <div className="card">
        <div className="ctitle">🗓 Plan Your Trip</div>
        <label className="lbl">Destination</label>
        <div style={{marginBottom:12}}>
          <LocationSearch placeholder="River, city, or region…" initialValue={loc.label} onSelect={s=>setLoc(s)}/>
        </div>
        <label className="lbl">Trip Date</label>
        <input className="inp" type="date" value={date} min={new Date().toISOString().split("T")[0]} onChange={e=>setDate(e.target.value)}/>
        {error&&<div className="err">{error}</div>}
        <button className="gen" onClick={generate} disabled={busy}>{busy?"Generating…":"✦ Generate Fishing Report"}</button>
      </div>

      {steps.length>0&&<div className="card">{steps.map((s,i)=><div key={i} className={`step ${s.state}`}><div className="dot"/>{s.text}</div>)}</div>}

      {wxData?.daily&&!busy&&(
        <div className="card">
          <div className="ctitle">🌤 7-Day Forecast</div>
          <WeekForecast data={wxData} highlightDay={daysOut}/>
        </div>
      )}

      {gauges.length>0&&!busy&&(
        <div className="card">
          <div className="ctitle">💧 Stream Gauges</div>
          <div className="csub">Nearest gauges · tap to see flow history</div>
          <GaugeList gauges={gauges}/>
        </div>
      )}



      {shops.length>0&&!busy&&(
        <div className="card">
          <div className="ctitle">🪝 Top Fly Shops</div>
          <div className="csub">Sourced from current web results · sorted by proximity</div>
          {shops.map((s,i)=>(
            <div className="scard" key={i}>
              <div className="sname">{i+1}. {s.name}</div>
              <div className="smeta">
                {s.rating&&<span className="srat">★ {s.rating}</span>}
                {s.reviews&&<span>({Number(s.reviews).toLocaleString()} reviews)</span>}
                {s.distanceMiles&&<span>~{s.distanceMiles} mi away</span>}
                {s.address&&<span>{s.address}</span>}
              </div>
              {s.specialty&&<div style={{fontSize:12,color:"var(--sky)",marginTop:4,fontStyle:"italic"}}>{s.specialty}</div>}
              <div style={{display:"flex",gap:10,marginTop:6,flexWrap:"wrap"}}>
                {s.website&&s.website!=="https://"&&<a href={s.website} target="_blank" rel="noreferrer" style={{fontSize:12,color:"var(--gold)",textDecoration:"none",display:"flex",alignItems:"center",gap:4}}>🌐 Visit Website</a>}
                <a href={`https://www.google.com/maps/search/${encodeURIComponent((s.name||"")+" "+(s.address||""))}`} target="_blank" rel="noreferrer" style={{fontSize:12,color:"var(--sky)",textDecoration:"none",display:"flex",alignItems:"center",gap:4}}>📍 Maps</a>
              </div>
            </div>
          ))}
        </div>
      )}

      {report&&!busy&&(
        <div className="card">
          <div className="ctitle">🎣 Fishing Report</div>
          <div className="csub">Synthesized from current web reports</div>
          <p style={{fontSize:14,color:"var(--foam)",lineHeight:1.65,marginBottom:14}}>{report.overview}</p>
          {report.recommendation&&(
            <div style={{background:"rgba(90,122,74,0.2)",border:"1px solid rgba(90,122,74,0.4)",borderRadius:12,padding:"12px 14px",marginBottom:14,display:"flex",gap:10,alignItems:"flex-start"}}>
              <span style={{fontSize:20,flexShrink:0}}>🏆</span>
              <div>
                <div style={{fontSize:11,color:"#9cd47a",letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>Best Bet Today</div>
                <p style={{fontSize:14,color:"var(--foam)",lineHeight:1.6}}>{report.recommendation}</p>
              </div>
            </div>
          )}
          {report.rivers?.length>0&&<><div className="divider"/>
            {report.rivers.map((r,i)=>(
              <div className="rb" key={i}>
                <div className="rriver">🏞 {r.name}</div>
                <div className="rbody">{r.conditions}</div>
                {r.techniques&&<div className="rtech">{r.techniques}</div>}
                {r.flies?.length>0&&<div className="chips">{r.flies.map((f,j)=><a key={j} className="chip" href={`https://www.google.com/search?q=${encodeURIComponent(f+" fly pattern")}&tbm=isch`} target="_blank" rel="noreferrer" style={{textDecoration:"none",cursor:"pointer"}}>🪶 {f}</a>)}</div>}
              </div>
            ))}
            <ReportMap rivers={report.rivers} center={loc}/>
          </>}
          {report.hatches&&<><div className="slbl">Hatch Activity</div><p style={{fontSize:14,color:"var(--foam)",lineHeight:1.65,marginBottom:14}}>{report.hatches}</p></>}
          {report.bestTimes&&<><div className="slbl">Best Times</div><p style={{fontSize:14,color:"var(--foam)",lineHeight:1.65,marginBottom:14}}>{report.bestTimes}</p></>}
          {report.tips&&<><div className="slbl">Insider Tips</div><p style={{fontSize:14,color:"var(--foam)",lineHeight:1.65,marginBottom:14}}>{report.tips}</p></>}
          {report.flyBoxEssentials?.length>0&&<><div className="divider"/><div className="slbl">Fly Box Essentials</div><div className="chips">{report.flyBoxEssentials.map((f,i)=><a key={i} className="chip" href={`https://www.google.com/search?q=${encodeURIComponent(f+" fly pattern")}&tbm=isch`} target="_blank" rel="noreferrer" style={{textDecoration:"none",cursor:"pointer"}}>🪶 {f}</a>)}</div></>}
        </div>
      )}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App({user}){
  const [tab,setTab]=useState("conditions");
  const [addOpen,setAddOpen]=useState(false);
  const [loc,setLoc]=useState(null);
  const [weather,setWeather]=useState(null);
  const [wxLoading,setWxLoading]=useState(false);
  const [wxError,setWxError]=useState(null);
  const [wxForecast,setWxForecast]=useState(null);
  const [gauges,setGauges]=useState([]);
  const [gaugeLoading,setGaugeLoading]=useState(false);
  const [gaugeError,setGaugeError]=useState(null);
  const [lastUpd,setLastUpd]=useState(null);
  const [catches,setCatches]=useState([]);
  const [catchesLoading,setCatchesLoading]=useState(true);

  // Load catches from Supabase on mount
  useEffect(()=>{
    if(!user) return;
    if(!sb){ setCatchesLoading(false); return; }
    sb.from("catches").select("*").eq("user_id",user.id).order("created_at",{ascending:false})
      .then(({data,error})=>{
        if(!error&&data) setCatches(data.map(r=>({id:r.id,species:r.species,length:r.length,flies:r.flies||[],photo:r.photo,gps:r.gps,time:r.time,notes:r.notes,airTemp:r.air_temp,weatherDesc:r.weather_desc,windSpeed:r.wind_speed,windDir:r.wind_dir,pressure:r.pressure,streamCFS:r.stream_cfs,streamCondition:r.stream_condition,streamGaugeName:r.stream_gauge_name})));
        setCatchesLoading(false);
      });
  },[user]);

  async function addCatch(catchData){
    if(!sb){ setCatches(c=>[{id:"local-"+Date.now(),...catchData},...c]); return; }
    const{data,error}=await sb.from("catches").insert({
      user_id:user.id,
      species:catchData.species, length:catchData.length, flies:catchData.flies,
      photo:catchData.photo, gps:catchData.gps, time:catchData.time, notes:catchData.notes,
      air_temp:catchData.air_temp, weather_desc:catchData.weather_desc,
      wind_speed:catchData.wind_speed, wind_dir:catchData.wind_dir, pressure:catchData.pressure,
      stream_cfs:catchData.stream_cfs, stream_condition:catchData.stream_condition,
      stream_gauge_name:catchData.stream_gauge_name
    }).select().single();
    if(!error&&data) setCatches(c=>[{id:data.id,...catchData},...c]);
  }

  async function deleteCatch(id){
    if(sb) await sb.from("catches").delete().eq("id",id);
    setCatches(cs=>cs.filter(x=>x.id!==id));
  }
  const blank={species:"Brown Trout",length:"",flies:[],flyInput:"",notes:"",photo:null,gps:"",time:"",airTemp:"",weatherDesc:"",windSpeed:"",windDir:"",pressure:"",streamCFS:"",streamCondition:"",streamGaugeName:"",sizeEstimating:false,sizeEstimated:false};
  const [form,setForm]=useState(blank);
  const camRef=useRef(),galRef=useRef();

  async function loadConditions(newLoc){
    setLoc(newLoc);
    const{lat,lng}=newLoc;
    setWxLoading(true);setWxError(null);
    try{
      const d=await fetchWeather(lat,lng);
      const c=d.current;
      const pressureInHg=(c.surface_pressure*0.02953).toFixed(2);
      const prevPressure=wxForecast?.current?.surface_pressure?(wxForecast.current.surface_pressure*0.02953):null;
      const trend=pressureTrend(parseFloat(pressureInHg), prevPressure);
      setWeather({
        temp:Math.round(c.temperature_2m),
        humidity:c.relative_humidity_2m,
        wind:Math.round(c.wind_speed_10m),
        windDir:windDir(c.wind_direction_10m),
        pressure:pressureInHg,
        pressureTrend:trend,
        pressureNote:fishingPressureNote(pressureInHg),
        uv:Math.round(c.uv_index??0),
        desc:`${WX_EMOJI[c.weather_code]||""} ${WX_DESC[c.weather_code]||""}`.trim()
      });
      setWxForecast(d);
    }catch{setWxError("Weather unavailable.");}
    finally{setWxLoading(false);}
    setGaugeLoading(true);setGaugeError(null);setGauges([]);
    try{
      const d=await fetchUSGSLive(lat,lng);
      const ts=d.value?.timeSeries??[];
      if(!ts.length){setGaugeError("No gauges found. Debug: "+(window._usgsDebug||"no debug info"));return;}
      const rawParsed=ts.map(t=>{
        const raw=t.values?.[0]?.value?.[0]?.value;const cfs=raw!=null?parseFloat(raw):null;
        const{label,cls}=cfsLabel(cfs);
        const siteNo=(t.sourceInfo?.siteCode?.[0]?.value)||"";
        const siteLat=parseFloat(t.sourceInfo?.geoLocation?.geogLocation?.latitude||0);
        const siteLng=parseFloat(t.sourceInfo?.geoLocation?.geogLocation?.longitude||0);
        const dist=Math.sqrt(Math.pow(siteLat-lat,2)+Math.pow(siteLng-lng,2));
        return{name:t.sourceInfo?.siteName??"Unknown",cfs,label,cls,siteNo,dist};
      }).filter(s=>s.cfs===null||(s.cfs>=0&&s.cfs<500000))
        .sort((a,b)=>a.dist-b.dist)
        .slice(0,8);
      // Fetch per-site historical max in parallel, fallback to relative scaling
      const [statResults, tempResults]=await Promise.all([
        Promise.all(rawParsed.map(g=>fetchUSGSStat(g.siteNo))),
        Promise.all(rawParsed.map(g=>fetchUSGSTemp(g.siteNo)))
      ]);
      const parsed=rawParsed.map((g,i)=>{
        const histMax=statResults[i];
        const waterTempF=tempResults[i];
        const pct=g.cfs!=null?(histMax?Math.min(Math.round((g.cfs/histMax)*100),100):Math.min(Math.round((g.cfs/Math.max(...rawParsed.map(x=>x.cfs||0),1))*95),100)):0;
        // Re-label using historical pct now that we have it
        const{label,cls}=cfsLabel(g.cfs, histMax?pct:null);
        return{...g,pct,histMax,waterTempF,label,cls};
      });
      setGauges(parsed);
      setLastUpd(new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
    }catch{setGaugeError("Could not load stream data.");}
    finally{setGaugeLoading(false);}
  }

  function handlePhoto(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async ev=>{
      // Extract EXIF date, GPS from photo binary
      function parseExif(arrayBuffer){
        const result={time:null,gps:null};
        try{
          const view=new DataView(arrayBuffer);
          if(view.getUint16(0)!==0xFFD8) return result;
          let offset=2;
          while(offset<view.byteLength-4){
            const marker=view.getUint16(offset);
            const segLen=view.getUint16(offset+2);
            if(marker===0xFFE1){
              const hdr=String.fromCharCode(view.getUint8(offset+4),view.getUint8(offset+5),view.getUint8(offset+6),view.getUint8(offset+7));
              if(hdr==="Exif"){
                const tiff=offset+10;
                const le=view.getUint16(tiff)===0x4949;
                const u16=(o)=>view.getUint16(tiff+o,le);
                const u32=(o)=>view.getUint32(tiff+o,le);
                const rational=(o)=>{const n=u32(o),d=u32(o+4);return d?n/d:0;};
                // Read IFD entries - also follow SubIFD (Exif IFD) for DateTimeOriginal
                function readIFD(ifdOff){
                  const n=u16(ifdOff);
                  let subExifOff=null;
                  let gpsOff=null;
                  for(let i=0;i<n;i++){
                    const e=ifdOff+2+(i*12);
                    const tag=u16(e);
                    const type=u16(e+2);
                    const valOff=u32(e+8);
                    if(tag===0x9003||tag===0x0132){
                      // DateTimeOriginal or DateTime
                      let s="";
                      for(let j=0;j<19;j++){const c=view.getUint8(tiff+valOff+j);if(c===0)break;s+=String.fromCharCode(c);}
                      const m=s.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
                      if(m&&!result.time){
                        const d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
                        result.time=d.toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
                      }
                    }
                    if(tag===0x8769) subExifOff=valOff;
                    if(tag===0x8825) gpsOff=valOff;
                  }
                  if(subExifOff) readIFD(subExifOff);
                  if(gpsOff){
                    // Parse GPS IFD
                    const gn=u16(gpsOff);
                    let latD=null,latR="N",lngD=null,lngR="E";
                    for(let i=0;i<gn;i++){
                      const e=gpsOff+2+(i*12);
                      const tag=u16(e);
                      const valOff=u32(e+8);
                      if(tag===1) latR=String.fromCharCode(view.getUint8(tiff+valOff));
                      if(tag===3) lngR=String.fromCharCode(view.getUint8(tiff+valOff));
                      if(tag===2){
                        const deg=rational(valOff),min=rational(valOff+8),sec=rational(valOff+16);
                        latD=deg+min/60+sec/3600;
                      }
                      if(tag===4){
                        const deg=rational(valOff),min=rational(valOff+8),sec=rational(valOff+16);
                        lngD=deg+min/60+sec/3600;
                      }
                    }
                    if(latD!=null&&lngD!=null){
                      const lat=latR==="S"?-latD:latD;
                      const lng=lngR==="W"?-lngD:lngD;
                      result.gps=fmtCoord(lat,lng);
                      result.lat=lat; result.lng=lng;
                    }
                  }
                }
                readIFD(u32(4));
              }
            }
            if(segLen<2) break;
            offset+=2+segLen;
          }
        }catch(ex){}
        return result;
      }

      let photoTime=null, photoGps=null, photoLat=null, photoLng=null;
      try{
        const abuf=await file.arrayBuffer();
        const exif=parseExif(abuf);
        photoTime=exif.time;
        photoGps=exif.gps;
        photoLat=exif.lat??null;
        photoLng=exif.lng??null;
      }catch{}
      if(!photoTime&&file.lastModified&&Date.now()-file.lastModified>5000){
        photoTime=new Date(file.lastModified).toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
      }
      const t=photoTime||new Date().toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
      const g=photoGps||(loc?fmtCoord(loc.lat,loc.lng):"");

      // Set photo + time + gps immediately
      setForm(f=>({...f,photo:ev.target.result,gps:g,time:t,sizeEstimating:true}));

      // Fetch conditions from photo GPS if available, else fall back to loaded conditions
      const fetchLat=photoLat??loc?.lat??null;
      const fetchLng=photoLng??loc?.lng??null;
      if(fetchLat&&fetchLng){
        try{
          const [wxData, usgsData] = await Promise.all([
            fetchWeather(fetchLat, fetchLng),
            fetchUSGSLive(fetchLat, fetchLng)
          ]);
          const c=wxData.current;
          const pressureInHg=(c.surface_pressure*0.02953).toFixed(2);
          const pTrend=pressureTrend(parseFloat(pressureInHg),null);
          const wxDesc=`${WX_EMOJI[c.weather_code]||""} ${WX_DESC[c.weather_code]||""}`.trim();
          // Parse closest gauge
          const ts=(usgsData.value?.timeSeries)??[];
          let topGauge=null;
          if(ts.length){
            const parsed=ts.map(t=>{
              const raw=t.values?.[0]?.value?.[0]?.value;
              const cfs=raw!=null?parseFloat(raw):null;
              const siteLat=parseFloat(t.sourceInfo?.geoLocation?.geogLocation?.latitude||0);
              const siteLng=parseFloat(t.sourceInfo?.geoLocation?.geogLocation?.longitude||0);
              const dist=Math.sqrt(Math.pow(siteLat-fetchLat,2)+Math.pow(siteLng-fetchLng,2));
              return{name:t.sourceInfo?.siteName??"",cfs,dist,label:cfsLabel(cfs,null).label};
            }).filter(x=>x.cfs!=null&&x.cfs>=0&&x.cfs<500000).sort((a,b)=>a.dist-b.dist);
            if(parsed.length) topGauge=parsed[0];
          }
          setForm(f=>({...f,
            airTemp:String(Math.round(c.temperature_2m)),
            weatherDesc:wxDesc,
            windSpeed:String(Math.round(c.wind_speed_10m)),
            windDir:windDir(c.wind_direction_10m),
            pressure:pressureInHg,
            streamCFS:topGauge?String(Math.round(topGauge.cfs)):"",
            streamCondition:topGauge?topGauge.label:"",
            streamGaugeName:topGauge?topGauge.name:""
          }));
        }catch(e){
          // Fall back to currently loaded conditions
          const topGauge=gauges[0]||null;
          setForm(f=>({...f,
            airTemp:weather?String(weather.temp):"",
            weatherDesc:weather?weather.desc:"",
            windSpeed:weather?String(weather.wind):"",
            windDir:weather?weather.windDir:"",
            pressure:weather?String(weather.pressure):"",
            streamCFS:topGauge?String(Math.round(topGauge.cfs||0)):"",
            streamCondition:topGauge?topGauge.label:"",
            streamGaugeName:topGauge?topGauge.name:""
          }));
        }
      } else {
        // No GPS at all — use whatever is loaded on Conditions tab
        const topGauge=gauges[0]||null;
        setForm(f=>({...f,
          airTemp:weather?String(weather.temp):"",
          weatherDesc:weather?weather.desc:"",
          windSpeed:weather?String(weather.wind):"",
          windDir:weather?weather.windDir:"",
          pressure:weather?String(weather.pressure):"",
          streamCFS:topGauge?String(Math.round(topGauge.cfs||0)):"",
          streamCondition:topGauge?topGauge.label:"",
          streamGaugeName:topGauge?topGauge.name:""
        }));
      }

      // Auto-estimate fish size from photo using Claude vision
      const key=getKey();
      if(!key){ setForm(f=>({...f,sizeEstimating:false})); return; }
      try{
        const base64=ev.target.result.split(",")[1];
        const mediaType=file.type||"image/jpeg";
        const res=await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
          body:JSON.stringify({
            model:"claude-sonnet-4-20250514",
            max_tokens:100,
            messages:[{role:"user",content:[
              {type:"image",source:{type:"base64",media_type:mediaType,data:base64}},
              {type:"text",text:"This is a photo of a fish catch. Estimate the fish length in inches based on visual cues like the angler's hands, rod, reel, net, or any visible reference objects. Reply with ONLY a single number (the estimated inches). If you truly cannot estimate, reply with just the word 'unknown'."}
            ]}]
          })
        });
        const d=await res.json();
        const txt=((d.content||[])[0]?.text||"").trim();
        const num=parseFloat(txt);
        if(!isNaN(num)&&num>0&&num<100){
          setForm(f=>({...f,length:String(Math.round(num)),sizeEstimating:false,sizeEstimated:true}));
        } else {
          setForm(f=>({...f,sizeEstimating:false}));
        }
      }catch(err){
        setForm(f=>({...f,sizeEstimating:false}));
      }
    };
    reader.readAsDataURL(file);e.target.value="";
  }

  function addFly(){if(!form.flyInput.trim())return;setForm(f=>({...f,flies:[...f.flies,f.flyInput.trim()],flyInput:""}));}
  function removeFly(i){setForm(f=>({...f,flies:f.flies.filter((_,j)=>j!==i)}));}
  function submitCatch(){
    const now=new Date();
    const t=form.time||now.toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
    const catchData={
      species:form.species,length:form.length,flies:[...form.flies],photo:form.photo,
      gps:form.gps||"Location not recorded",time:t,notes:form.notes,
      air_temp:form.airTemp,weather_desc:form.weatherDesc,
      wind_speed:form.windSpeed,wind_dir:form.windDir,pressure:form.pressure,
      stream_cfs:form.streamCFS,stream_condition:form.streamCondition,
      stream_gauge_name:form.streamGaugeName
    };
    addCatch(catchData);
    setForm(blank);setAddOpen(false);
  }

  const hatches=HATCHES[new Date().getMonth()];

  return(
    <div className="app">
      <div className="bgbar"/>
      <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handlePhoto}/>
      <input ref={galRef} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhoto}/>

      <div className={`main${addOpen?" off":""}`}>
        <div className="hdr">
          <div style={{position:"absolute",top:14,right:16,zIndex:10}}>
            <button onClick={()=>sb?sb.auth.signOut():null}
              style={{background:"rgba(0,0,0,0.3)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"6px 12px",color:"var(--stone)",fontSize:12,cursor:"pointer",fontFamily:"'Crimson Pro',serif"}}>
              Sign Out
            </button>
          </div>
          <div className="title">Guide's <span>Choice</span></div>
          <div className="sub">Fly Fishing Journal</div>
          {user&&<div style={{fontSize:11,color:"var(--sky)",marginTop:4,fontStyle:"italic",letterSpacing:1}}>{user.email}</div>}
        </div>

        <div className="search-wrap">
          <LocationSearch placeholder="Search river, city, or state…" initialValue={loc?.label||""} onSelect={loadConditions}/>
        </div>
        <div className="loc-hint">
          {loc?`📌 ${loc.label}`:"Type a location · suggestions appear as you type · 📍 for GPS"}
        </div>

        <div className="nav">
          {[{id:"conditions",icon:"🌤",label:"Conditions"},{id:"log",icon:"🐟",label:"Catch Log"},{id:"plan",icon:"🗓",label:"Plan Trip"},{id:"guide",icon:"🧭",label:"Guide"}].map(t=>(
            <button key={t.id} className={`nb${tab===t.id?" on":""}`} onClick={()=>setTab(t.id)}>
              <span className="ic">{t.icon}</span>{t.label}
            </button>
          ))}
        </div>

        <div className="content">
          {tab==="conditions"&&<>
            {!loc&&<div className="info-box">🔍 <strong>Type a location above</strong> to load live weather and stream conditions.<br/><br/>Try: <em>"Boulder, CO"</em> · <em>"Madison River, MT"</em> · <em>"Deschutes River, OR"</em></div>}
            {loc&&<>
              <div className="card">
                <div className="ctitle">🌡 Current Weather<button className="rfsh" onClick={()=>loadConditions(loc)}>↻ Refresh</button></div>
                {wxLoading&&<div className="loading">Fetching weather…</div>}
                {wxError&&<div className="err">{wxError}</div>}
                {weather&&!wxLoading&&<>
                  <div className="wx-main"><div><div className="wx-temp">{weather.temp}°F</div><div className="wx-desc">{weather.desc}</div></div></div>
                  <div className="wx-grid">
                    <div className="wx-item">
                      <div className="wx-val">💨 {weather.wind} mph</div>
                      <div className="wx-lbl">Wind {weather.windDir}</div>
                    </div>
                    <div className="wx-item">
                      <div className="wx-val">💧 {weather.humidity}%</div>
                      <div className="wx-lbl">Humidity</div>
                    </div>
                    <div className="wx-item">
                      <div className="wx-val">☀️ {weather.uv}</div>
                      <div className="wx-lbl">UV Index</div>
                    </div>
                    <div className="wx-item">
                      <div className="wx-val" style={{color:weather.pressureTrend?.color}}>
                        {weather.pressureTrend?.icon} {weather.pressure} in
                      </div>
                      <div className="wx-lbl">Pressure · {weather.pressureTrend?.label}</div>
                    </div>
                  </div>
                  {weather.pressureNote&&(
                    <div style={{marginTop:10,padding:"8px 12px",background:"rgba(0,0,0,0.2)",borderRadius:10,fontSize:12,color:"var(--sky)",fontStyle:"italic"}}>
                      🎣 {weather.pressureNote}
                    </div>
                  )}
                </>}
              </div>
              <div className="card">
                <div className="ctitle">💧 Nearby Stream Gauges<button className="rfsh" onClick={()=>loadConditions(loc)}>↻</button></div>
                <div className="csub">Live USGS · Search by city for best results{lastUpd&&` · Updated ${lastUpd}`}</div>
                {gaugeLoading&&<div className="loading">Loading gauges…</div>}
                {gaugeError&&!gaugeLoading&&<div className="err">{gaugeError}</div>}
                {!gaugeLoading&&<GaugeList gauges={gauges}/>}
              </div>
            </>}
            <div className="card">
              <div className="ctitle">🌙 Moon Phase</div>
              <MoonCard/>
            </div>
            {weather&&(
              <div className="card">
                <div className="ctitle">🌤 7-Day Forecast</div>
                <WeekForecast data={wxForecast}/>
              </div>
            )}
            <RegsLink label={loc?.label}/>
            <div className="card">
              <div className="ctitle">🪲 This Month's Hatches</div>
              <HatchList hatches={hatches}/>
            </div>
          </>}

          {tab==="log"&&<>
            <div className="lhdr" style={{flexDirection:"column",gap:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%"}}>
                <span className="lttl">My Catches · {catches.length} fish</span>
                <button className="btn" style={{padding:"6px 12px",fontSize:12}} onClick={()=>{
                  const rows=[["Species","Length","Flies","GPS","Date","Notes","Air Temp (F)","Weather","Wind","Pressure (inHg)","Stream CFS","Stream Condition","Gauge Name"],...catches.map(c=>[c.species,c.length,c.flies.join("|"),c.gps,c.time,c.notes,c.airTemp||"",c.weatherDesc||"",c.windSpeed?(c.windSpeed+" mph "+(c.windDir||"")):"",c.pressure||"",c.streamCFS||"",c.streamCondition||"",c.streamGaugeName||""])];
                  const csv=rows.map(r=>r.map(v=>`"${(v||"").toString().replace(/"/g,'""')}"`).join(",")).join("\n");
                  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="tight-lines-catches.csv";a.click();
                }}>⬇ CSV</button>
              </div>
              {catches.length>0&&(()=>{
                const counts={};catches.forEach(c=>{counts[c.species]=(counts[c.species]||0)+1;});
                const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
                const max=sorted[0][1];
                return(<div style={{width:"100%"}}>
                  {sorted.map(([sp,n])=>(
                    <div key={sp} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                      <span style={{fontSize:11,color:"var(--stone)",width:120,flexShrink:0}}>{sp}</span>
                      <div style={{flex:1,height:8,background:"rgba(0,0,0,0.3)",borderRadius:4,overflow:"hidden"}}>
                        <div style={{width:`${(n/max)*100}%`,height:"100%",background:"linear-gradient(90deg,var(--sky),var(--water))",borderRadius:4}}/>
                      </div>
                      <span style={{fontSize:11,color:"var(--sky)",width:20,textAlign:"right"}}>{n}</span>
                    </div>
                  ))}
                </div>);
              })()}
            </div>
            {catches.length===0&&<div className="empty"><div className="ei">🎣</div><p>No catches yet.<br/>Tap + to record your first!</p></div>}
            {catches.map(c=>(
              <div className="cc" key={c.id}>
                {c.photo?<img src={c.photo} className="c-img" alt="catch"/>:<div className="c-ph">🐟</div>}
                <div className="cb">
                  <div className="csp">{c.species}</div>
                  <div className="cm">
                    {c.length&&<span className="cmi">📏 {c.length}"</span>}
                    <span className="cmi">🕐 {c.time}</span>
                  </div>
                  {c.flies.length>0&&<div className="cff">{c.flies.map((f,i)=><a key={i} className="cfly" href={`https://www.google.com/search?q=${encodeURIComponent(f+" fly pattern")}&tbm=isch`} target="_blank" rel="noreferrer" style={{textDecoration:"none",cursor:"pointer"}}>🪶 {f}</a>)}</div>}
                  {c.notes&&<p style={{fontSize:13,color:"var(--sky)",marginTop:8,fontStyle:"italic"}}>{c.notes}</p>}
                  {(c.airTemp||c.streamCFS||c.weatherDesc)&&(
                    <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:6,fontSize:11,color:"var(--stone)"}}>
                      {c.weatherDesc&&<span>{c.weatherDesc}</span>}
                      {c.airTemp&&<span>🌡 {c.airTemp}°F</span>}
                      {c.windSpeed&&<span>💨 {c.windSpeed} mph {c.windDir}</span>}
                      {c.streamCFS&&<span>💧 {Number(c.streamCFS).toLocaleString()} CFS · {c.streamCondition}</span>}
                    </div>
                  )}
                  <div className="cgps">📍 {c.gps}</div>
                  <button onClick={()=>deleteCatch(c.id)}
                    style={{marginTop:8,background:"rgba(150,80,80,0.3)",border:"1px solid rgba(150,80,80,0.4)",borderRadius:8,padding:"4px 12px",color:"var(--red)",fontSize:12,cursor:"pointer",fontFamily:"'Crimson Pro',serif"}}>
                    Delete Catch
                  </button>
                </div>
              </div>
            ))}
          </>}

          {tab==="plan"&&<TripPlanner defaultLocation={loc?.label||""}/>}
          {tab==="guide"&&<GuideBook user={user}/>}
        </div>

        {tab==="log"&&(
          <button className="fab" onClick={()=>{setForm(blank);setAddOpen(true);}}
            style={{position:"fixed",bottom:28,right:"max(20px, calc(50% - 195px))"}}>＋</button>
        )}
      </div>

      <div className={`slide${addOpen?" on":""}`}>
        <div className="slide-hdr">
          <button className="back" onClick={()=>setAddOpen(false)}>← Back</button>
          <span className="slide-title">Record a Catch</span>
        </div>
        <div style={{padding:"20px 16px 48px"}}>
          <label className="lbl">Photo</label>
          {form.photo?(
            <div className="pw">
              <img src={form.photo} className="p-img" alt="catch"/>
              <div className="pov">
                {form.gps&&<span className="ptag">📍 {form.gps}</span>}
                {form.time&&<span className="ttag">{form.time}</span>}
              </div>
              <button className="px" onClick={()=>setForm(f=>({...f,photo:null,gps:"",time:""}))}>✕</button>
            </div>
          ):(
            <div className="pbtns">
              <button className="pbtn" onClick={()=>camRef.current.click()}><span className="pi">📷</span>Take Photo</button>
              <button className="pbtn" onClick={()=>galRef.current.click()}><span className="pi">🖼️</span>Choose from Library</button>
            </div>
          )}
          <p className="hint">Time, GPS & conditions auto-filled from photo — edit if needed.</p>

          <label className="lbl">Date & Time</label>
          <input className="inp" placeholder="e.g. May 8, 2026 at 7:30 AM" value={form.time}
            onChange={e=>setForm(f=>({...f,time:e.target.value}))}/>

          <label className="lbl">GPS Location</label>
          <input className="inp" placeholder="e.g. 39.7392° N, 104.9903° W" value={form.gps}
            onChange={e=>setForm(f=>({...f,gps:e.target.value}))}/>

          <label className="lbl">Species</label>
          <select className="inp" value={form.species} onChange={e=>setForm(f=>({...f,species:e.target.value}))}>
            {SPECIES.map(s=><option key={s} value={s}>{s}</option>)}
          </select>

          <label className="lbl">Length (inches)
            {form.sizeEstimating&&<span style={{marginLeft:8,fontSize:11,color:"var(--sky)",fontStyle:"italic"}}>🔍 estimating from photo…</span>}
            {form.sizeEstimated&&!form.sizeEstimating&&<span style={{marginLeft:8,fontSize:11,color:"#9cd47a",fontStyle:"italic"}}>✨ AI estimated — adjust if needed</span>}
          </label>
          <input className="inp" type="number" placeholder="e.g. 18" value={form.length}
            onChange={e=>setForm(f=>({...f,length:e.target.value,sizeEstimated:false}))}
            style={form.sizeEstimated?{borderColor:"rgba(90,122,74,0.6)",background:"rgba(90,122,74,0.1)"}:{}}/>

          <label className="lbl">Flies Used</label>
          <div className="ftags">{form.flies.map((fly,i)=><div className="ftag" key={i}>🪶 {fly}<button onClick={()=>removeFly(i)}>×</button></div>)}</div>
          <div className="frow">
            <input className="inp" placeholder="e.g. Elk Hair Caddis #14" value={form.flyInput}
              onChange={e=>setForm(f=>({...f,flyInput:e.target.value}))}
              onKeyDown={e=>e.key==="Enter"&&addFly()}/>
            <button className="btn" onClick={addFly}>Add</button>
          </div>

          <label className="lbl">Conditions Snapshot</label>
          <div style={{background:"rgba(0,0,0,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <div>
                <div className="lbl" style={{marginBottom:4}}>Air Temp (°F)</div>
                <input className="inp" style={{marginBottom:0}} type="number" placeholder="65"
                  value={form.airTemp} onChange={e=>setForm(f=>({...f,airTemp:e.target.value}))}/>
              </div>
              <div>
                <div className="lbl" style={{marginBottom:4}}>Stream CFS</div>
                <input className="inp" style={{marginBottom:0}} type="number" placeholder="250"
                  value={form.streamCFS} onChange={e=>setForm(f=>({...f,streamCFS:e.target.value}))}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <div>
                <div className="lbl" style={{marginBottom:4}}>Wind (mph)</div>
                <input className="inp" style={{marginBottom:0}} type="number" placeholder="8"
                  value={form.windSpeed} onChange={e=>setForm(f=>({...f,windSpeed:e.target.value}))}/>
              </div>
              <div>
                <div className="lbl" style={{marginBottom:4}}>Wind Dir</div>
                <input className="inp" style={{marginBottom:0}} placeholder="SW"
                  value={form.windDir} onChange={e=>setForm(f=>({...f,windDir:e.target.value}))}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <div>
                <div className="lbl" style={{marginBottom:4}}>Pressure (inHg)</div>
                <input className="inp" style={{marginBottom:0}} placeholder="29.92"
                  value={form.pressure} onChange={e=>setForm(f=>({...f,pressure:e.target.value}))}/>
              </div>
              <div>
                <div className="lbl" style={{marginBottom:4}}>Flow Condition</div>
                <input className="inp" style={{marginBottom:0}} placeholder="Good"
                  value={form.streamCondition} onChange={e=>setForm(f=>({...f,streamCondition:e.target.value}))}/>
              </div>
            </div>
            <div>
              <div className="lbl" style={{marginBottom:4}}>Sky / Weather</div>
              <input className="inp" style={{marginBottom:0}} placeholder="e.g. ☀️ Sunny"
                value={form.weatherDesc} onChange={e=>setForm(f=>({...f,weatherDesc:e.target.value}))}/>
            </div>
            {form.streamGaugeName&&<div style={{fontSize:11,color:"var(--stone)",marginTop:6,fontStyle:"italic"}}>📍 Gauge: {form.streamGaugeName}</div>}
          </div>

          <label className="lbl">Notes</label>
          <textarea className="inp" rows={4} style={{resize:"none"}} placeholder="Where, how, conditions…"
            value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/>
          <button className="btn btnp" onClick={submitCatch}>🐟 Save to Log</button>
        </div>
      </div>
    </div>
  );
}

function Root(){
  const {user, loading} = useAuth();
  if(loading) return(
    <div style={{minHeight:"100vh",background:"var(--deep)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:12}}>🎣</div>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:"var(--sky)",animation:"pulse 1.5s infinite"}}>Loading…</div>
      </div>
    </div>
  );
  // Only bypass auth if Supabase is genuinely not configured
  if(!SUPABASE_CONFIGURED) return <App user={{id:"local",email:"local user"}}/>;
  // Supabase IS configured - require login
  if(!user) return <AuthScreen/>;
  return <App user={user}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
